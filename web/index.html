<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marcam</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<!-- one compact row: the menus, the project, the examples, the status (Mar: no banner) -->
<nav id="projectBar" aria-label="Project">
  <details class="menu" id="menuFile"><summary>File</summary><div class="menu-items">
    <button id="projectNew" type="button" title="Start an empty project">New</button>
    <button id="projectOpen" type="button" title="Open a .marcam.json project (or a .project.json / .job.json)">Open...</button>
    <button id="projectSave" type="button" title="Save the project, with its part mesh, as one .marcam.json file">Save</button>
    <button id="projectSaveAs" type="button">Save as...</button>
    <hr>
    <button id="menuImport" type="button" title="Import an STL or a STEP file as the part (or drop it on the page)">Import part (STL, STEP)...</button>
    <button id="menuReplace" type="button" title="A new STL or STEP for the part: placement, setups and operations stay">Replace model...</button>
    <button id="menuDownload" type="button" title="Save the selected program's G-code">Download .nc</button>
  </div></details>
  <details class="menu" id="menuView"><summary>View</summary><div class="menu-items">
    <label><input id="showSide" type="checkbox"> side view</label>
  </div></details>
  <details class="menu" id="menuHelp"><summary>Help</summary><div class="menu-items">
    <div class="small"><strong>marcam</strong> <span id="version" class="muted"></span><br><span class="muted">4th-axis rotary CAM</span></div>
    <div class="small muted">Drag to orbit, scroll to zoom; the cube turns the view.</div>
  </div></details>
  <input id="projectOpenFile" type="file" accept=".json,application/json" hidden>
  <span class="projname"><span id="projectName">untitled</span><span id="projectDirty" class="dirty hidden" aria-label="unsaved changes">&#9679; unsaved</span></span>
  <button id="importStl" type="button" class="primary" title="Import an STL or a STEP file as the part (or drop it on the page)">Import STL...</button>
  <input id="importStlFile" type="file" accept=".stl,.step,.stp" hidden>
  <input id="replaceModelFile" type="file" accept=".stl,.step,.stp" hidden>
  <label for="example" class="small">Example</label>
  <select id="example">
    <option value="knob">Knob: profile + knurl (Makera Z1 goldens)</option>
    <option value="knob_finish">Knob: mesh rough + finish (needs knob.stl)</option>
    <option value="plate">Plate: 3-axis on the Carvera vise (needs dome.stl)</option>
    <option value="plaque">Relief plaque from an image (Carvera vise)</option>
    <option value="ring">Ring: wrapped engraving and V-carve (Z1)</option>
    <option value="knob_indexed">Knob + indexed 3+1: D-flat and cross hole</option>
  </select>
  <button id="loadExample" type="button">Load</button>
  <span class="spacer"></span>
  <span id="status" role="status">Loading engine...</span>
</nav>
<main>
  <section id="left">
    <div class="row">
      <label for="machine">Machine</label>
      <select id="machine"></select>
    </div>
    <div id="machineInfo" class="muted small"></div>
    <textarea id="machineJson" class="code hidden" rows="8" spellcheck="false" aria-label="Machine JSON"></textarea>
    <div class="row">
      <label for="mesh" title="The mesh file an opened project names, attached as it is (STL or 3MF); to bring in a new part, use Import STL">Attach mesh file</label>
      <input id="mesh" type="file" accept=".stl,.3mf,.step,.stp">
    </div>
    <div id="meshInfo" class="muted small"></div>
    <details id="libraryPanel">
      <summary>Tool library</summary>
      <div class="row">
        <select id="library" aria-label="Tool library"></select>
        <button id="exportLibrary" type="button">Export</button>
      </div>
      <div id="toolTableWrap" class="tablewrap"><table id="toolTable" class="tools small"></table></div>
      <div id="splitTools" class="splitter h" aria-label="Resize the tool list"></div>
      <div class="row">
        <button id="addTool" type="button">Add tool</button>
      </div>
      <form id="toolForm" class="toolform hidden">
        <label>Name <input id="tfName" required></label>
        <label>Kind <select id="tfKind">
          <option value="flat">flat</option><option value="ball">ball</option>
          <option value="bull">bull nose</option><option value="vbit">V-bit</option>
          <option value="tapered_ball">tapered ball</option>
          <option value="drill">drill</option></select></label>
        <label>Diameter <input id="tfDiameter" type="number" step="any" required></label>
        <label>Angle (V) <input id="tfAngle" type="number" step="any"></label>
        <label>Corner r <input id="tfCorner" type="number" step="any"></label>
        <label>Tip Ø (tapered) <input id="tfTip" type="number" step="any"></label>
        <label>Taper °/side <input id="tfTaper" type="number" step="any"></label>
        <label>Flute length <input id="tfFlute" type="number" step="any"></label>
        <label>Number <input id="tfNumber" type="number" step="1"></label>
        <div class="row"><button id="tfSave" type="submit" class="primary">Save tool</button>
          <button id="tfCancel" type="button">Cancel</button></div>
      </form>
      <div class="row small">
        <label for="importFile">Import</label>
        <input id="importFile" type="file" accept=".json,.tools,.mch,.f3d">
      </div>
      <div class="row small">
        <input id="importUrl" type="url" placeholder="https://... (.tools, .json, .mch, .f3d)" aria-label="Import URL">
        <button id="importUrlBtn" type="button">Import URL</button>
      </div>
      <div id="importInfo" class="muted small"></div>
    </details>
    <details id="projectPanel" open>
      <summary>Project</summary>
      <div id="tree" class="tree small"></div>
    </details>
    <details open>
      <summary>Quick settings</summary>
      <div id="quick" class="quick"></div>
    </details>
    <!-- the project as text: the app's store, shown only for debugging (?json, or Ctrl+Shift+J) -->
    <details open id="jsonPanel" class="hidden">
      <summary>Project JSON (developer)</summary>
      <textarea id="job" class="code" rows="18" spellcheck="false" aria-label="Project JSON"></textarea>
    </details>
    <div class="row">
      <button id="generate" type="button" class="primary" disabled>Generate</button>
      <button id="simulate" type="button" disabled>Simulate stock</button>
      <label class="small" title="Generate again by itself 0.8 s after an edit (never while dragging)"><input id="autoGen" type="checkbox"> auto-regenerate</label>
    </div>
    <div class="row small" id="simResRow">
      <label for="simRes">Simulation grid</label>
      <select id="simRes" aria-label="Simulation grid resolution">
        <option value="coarse">Coarse</option>
        <option value="normal" selected>Normal</option>
        <option value="fine">Fine</option>
        <option value="ultra">Ultra</option>
        <option value="custom">Custom</option>
      </select>
      <span id="simResCustom" class="hidden">
        <input id="simDx" type="number" step="0.005" min="0.005" value="0.1" size="5" title="Rotary: cell length along X (mm)" aria-label="Rotary cell along X (mm)"> mm &times;
        <input id="simDeg" type="number" step="0.05" min="0.05" value="1.5" size="4" title="Rotary: cell angle (degrees)" aria-label="Rotary cell angle (degrees)">&deg; &middot; 3-axis
        <input id="simCell" type="number" step="0.01" min="0.01" value="0.25" size="5" title="3-axis: cell size (mm)" aria-label="3-axis cell size (mm)"> mm
      </span>
    </div>
    <div class="row small">
      <!-- the GPU is used when there is one; ?gpu=off turns it off (debugging) -->
      <label class="hidden"><input id="simGpu" type="checkbox" checked> use the GPU (WebGPU) when there is one</label>
      <span id="simBackend" class="muted" title="where the last simulation ran"></span>
    </div>
    <div id="simResInfo" class="small muted"></div>
    <div id="error" class="error hidden" role="alert"></div>
  </section>
  <div id="splitLeft" class="splitter v" aria-label="Resize the settings panel"></div>
  <section id="right">
    <div id="undoBar" class="undo-banner hidden" role="status"></div>
    <div class="row tabs-row"><div id="tabs" role="tablist"></div>
      <button id="download" type="button" disabled title="Save the selected program's G-code">Download .nc</button>
      <span id="codeInfo" class="small muted"></span></div>
    <div id="summary"></div>
    <div id="views">
      <div id="viewWrap">
        <div id="view3d" aria-label="3D preview"></div>
        <div id="split3d" class="splitter h" aria-label="Resize the 3D view and the side view"></div>
        <div id="viewNote" class="muted small"></div>
        <div class="row scrub">
          <label for="scrub">Moves</label>
          <input id="scrub" type="range" min="0" max="0" value="0" disabled>
          <span id="scrubLabel" class="small"></span>
        </div>
        <div class="row small">
          <label><input id="showRapids" type="checkbox" checked> rapids</label>
          <label><input id="showStock" type="checkbox" checked> stock</label>
          <label><input id="showPart" type="checkbox" checked> part</label>
          <label><input id="showSim" type="checkbox" checked> simulated stock</label>

        </div>
        <div class="row small">
          <button id="simOpen" type="button">Machining simulation</button>
        </div>
        <div id="simControls" class="hidden">
          <div class="row scrub">
            <button id="simPlay" type="button">Play</button>
            <button id="simStep" type="button">Step</button>
            <label for="simSpeed" class="small">speed</label>
            <select id="simSpeed" aria-label="Playback speed (moves per second)">
              <option value="30">30 moves/s</option>
              <option value="300" selected>300 moves/s</option>
              <option value="3000">3000 moves/s</option>
              <option value="30000">30000 moves/s</option>
            </select>
            <label class="small"><input id="simGhost" type="checkbox"> removed material</label>
            <button id="simClose" type="button">Close</button>
          </div>
          <div class="row scrub">
            <input id="simScrub" type="range" min="0" max="0" value="0" aria-label="Simulation position">
          </div>
          <div id="simLabel" class="small"></div>
          <div id="opLegend" class="oplegend small" aria-label="Operation colours"></div>
        </div>
        <canvas id="side" width="900" height="220" aria-label="Side view: X against radius"></canvas>
      </div>
      <!-- (the G-code is not shown: Download .nc saves it; the viewer has the room) -->
      <div id="splitCode" class="splitter v hidden" aria-hidden="true"></div>
      <div id="codeWrap" class="hidden">
        <textarea id="gcode" class="code" readonly spellcheck="false" aria-label="G-code"></textarea>
      </div>
    </div>
  </section>
</main>
<dialog id="setupDialog" aria-labelledby="sdTitle">
  <form id="sdForm" method="dialog" novalidate>
    <h2 id="sdTitle">New project</h2>
    <div class="sd-grid">
      <label id="sdNameRow">Name <input id="sdName" autocomplete="off"></label>
      <label>Machine <select id="sdMachine"></select></label>
    </div>
    <fieldset class="sd-kinds">
      <legend>Setup type</legend>
      <label class="sd-kind" data-kind="rotary"><input type="radio" name="sdKind" value="rotary" checked><svg viewBox="0 0 48 32" aria-hidden="true"><rect x="2" y="13" width="8" height="6" fill="currentColor" opacity=".5"/><rect x="10" y="7" width="28" height="18" rx="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M40 6 a10 10 0 1 1 -2 -2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M38 1 l1 4 l-4 1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="24" y1="0" x2="24" y2="7" stroke="currentColor" stroke-width="3"/></svg><b>Rotary 4th axis</b><small>The part turns while the tool cuts (simultaneous): roughing and finishing all round a bar.</small></label>
      <label class="sd-kind" data-kind="indexed"><input type="radio" name="sdKind" value="indexed"><svg viewBox="0 0 48 32" aria-hidden="true"><rect x="2" y="13" width="8" height="6" fill="currentColor" opacity=".5"/><rect x="10" y="7" width="28" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="24" y1="0" x2="24" y2="7" stroke="currentColor" stroke-width="3"/><text x="39" y="12" font-size="8" fill="currentColor">0°</text><text x="30" y="32" font-size="8" fill="currentColor">180°</text></svg><b>Indexed 3+1</b><small>The bar is turned to fixed angles, then cut with 3-axis passes from each side.</small></label>
      <label class="sd-kind" data-kind="vise"><input type="radio" name="sdKind" value="vise"><svg viewBox="0 0 48 32" aria-hidden="true"><rect x="6" y="12" width="36" height="14" fill="none" stroke="currentColor" stroke-width="2"/><rect x="2" y="16" width="4" height="12" fill="currentColor" opacity=".5"/><rect x="42" y="16" width="4" height="12" fill="currentColor" opacity=".5"/><line x1="24" y1="0" x2="24" y2="12" stroke="currentColor" stroke-width="3"/></svg><b>3-axis vise</b><small>A block held in the vise, cut from the top.</small></label>
    </fieldset>
    <fieldset id="sdPartSet">
      <legend>Part</legend>
      <div class="sd-grid">
        <label id="sdFileRow">STL or STEP <input id="sdFile" type="file" accept=".stl,.step,.stp"></label>
        <span id="sdFileName" class="small muted"></span>
        <label>Units <select id="sdUnits"><option value="mm">mm</option><option value="inch">inch</option></select></label>
        <label><span id="sdAxisLabel">Part axis along X</span> <select id="sdAxis"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select></label>
        <label><span id="sdOriginLabel">Front at X0, then shift</span> <input id="sdOrigin" type="number" step="any" value="0"> mm</label>
        <label id="sdTailRow"><input id="sdTail" type="checkbox"> tailstock</label>
      </div>
      <canvas id="sdPreview" width="560" height="170" aria-label="Placement preview"></canvas>
      <div id="sdInfo" class="small muted"></div>
    </fieldset>
    <fieldset>
      <legend>Stock</legend>
      <label><input type="radio" name="sdStock" value="auto" checked> from the part, with a margin of <input id="sdMargin" type="number" step="any" min="0" value="0.5"> mm</label><br>
      <label><input type="radio" name="sdStock" value="explicit"> explicit:</label>
      <span id="sdBar">bar &Oslash; <input id="sdDia" type="number" step="any" min="0"> mm &times; <input id="sdLen" type="number" step="any" min="0"> mm long</span>
      <span id="sdBox" class="hidden">block <input id="sdBx" type="number" step="any" min="0"> &times; <input id="sdBy" type="number" step="any" min="0"> &times; <input id="sdBz" type="number" step="any" min="0"> mm</span>
    </fieldset>
    <div id="sdWarn" class="error hidden" role="alert"></div>
    <div class="row sd-buttons">
      <button id="sdCancel" type="button">Cancel</button>
      <button id="sdOk" type="submit" class="primary">Create</button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
