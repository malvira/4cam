[package]
name = "fourcam-py"
description = "Python bindings for 4cam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "fourcam"
crate-type = ["cdylib"]

[dependencies]
fourcam-wasm = { version = "0.1.0", path = "../fourcam-wasm" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
serde_json = "1"
