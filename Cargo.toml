[workspace]
resolver = "2"
members = ["crates/fourcam-core", "crates/fourcam-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/malvira/4cam"

# Geometry-heavy tests (drop-cutter, simulation) are far too slow unoptimised.
[profile.test]
opt-level = 3
