[package]
name = "fourcam-capi"
description = "C ABI for 4cam: JSON in, JSON out, for embedding in any language"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fourcam_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
fourcam-wasm = { path = "../fourcam-wasm" }
serde_json = "1"

[dev-dependencies]
# regenerate include/fourcam.h in a test (it must match the committed one), and compile
# the C example (examples/cc_run.rs)
cbindgen = { version = "0.29", default-features = false }
cc = "1"
