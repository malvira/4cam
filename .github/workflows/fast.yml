# The fast suite (scripts/check.sh --fast) on every push and pull request: what merges are
# gated on, in about a quarter of an hour on a runner. The full check (ci.yml) runs beside it
# and keeps up as it can (a newer push cancels an older run).
name: Fast

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scripts/check.sh --fast
        shell: bash
        env:
          MARCAM_E2E_SOFTWARE_GL: "1"
          MARCAM_PERF_SLACK: "8"
        run: |
          set -o pipefail
          sh scripts/check.sh --fast 2>&1 | tee fast.log
      - name: report the failure
        if: failure()
        shell: bash
        run: |
          msg=$( { grep -E '^(FAIL|error|Error)|panicked|^thread|Node\.js v' fast.log | head -n 40; echo "--- the end:"; tail -n 25 fast.log; } | tr -d '\r' | cut -c1-300 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=check.sh --fast failed::${msg}"
      - name: keep the log and the web screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast
          path: |
            fast.log
            web/tests/screenshots/
          if-no-files-found: ignore
