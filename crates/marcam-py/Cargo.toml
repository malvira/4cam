[package]
name = "marcam-py"
description = "Python bindings for marcam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "marcam"
crate-type = ["cdylib"]

[dependencies]
marcam-wasm = { version = "0.1.0", path = "../marcam-wasm" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
serde_json = "1"
