[package]
name = "fourcam-py"
description = "Python bindings for 4cam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fourcam"
crate-type = ["cdylib"]

[dependencies]
fourcam-wasm = { path = "../fourcam-wasm" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
serde_json = "1"
