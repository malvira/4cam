[workspace]
resolver = "2"
members = [
    "crates/marcam-core",
    "crates/marcam-cli",
    "crates/marcam-wasm",
    "crates/marcam-py",
    "crates/marcam-fixtures",
    "crates/marcam-gpu",
    "crates/marcam-capi",
    "crates/marcam-step",
    "adapters/solidcraft",
    "examples/embed/rust",
]
exclude = ["crates/web-time-shim"]
# the Python extension needs a Python toolchain; build it with scripts/build-python
default-members = ["crates/marcam-core", "crates/marcam-cli", "crates/marcam-wasm", "crates/marcam-fixtures", "crates/marcam-capi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/malvira/marcam"
homepage = "https://github.com/malvira/marcam"
readme = "README.md"
keywords = ["cam", "cnc", "gcode", "4th-axis", "toolpath"]
categories = ["science::robotics", "simulation", "command-line-utilities"]
rust-version = "1.99"

# Geometry-heavy tests (drop-cutter, simulation) are far too slow unoptimised.
[profile.test]
opt-level = 3

# the browser's STEP module (scripts/build-step-wasm.sh): SolidCraft's kernel is large, so it is
# built for size and without whole-program LTO (minutes, not tens of minutes)
[profile.release-step-wasm]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

# SolidCraft's kernel (the STEP import) times itself with `web-time`, which in the browser
# needs wasm-bindgen's JavaScript glue. Our stand-in is std::time natively and a still clock in
# WebAssembly, so the STEP module loads with no glue at all (crates/web-time-shim).
[patch.crates-io]
web-time = { path = "crates/web-time-shim" }
