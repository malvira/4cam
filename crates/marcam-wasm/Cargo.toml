[package]
name = "marcam-wasm"
description = "WebAssembly build of marcam (plain exports, JSON in and out, no bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# the tests read the repository's examples and fixtures: not shipped
exclude = ["tests/"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
marcam-core = { version = "0.1.0", path = "../marcam-core" }
serde_json = "1"
