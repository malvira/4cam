# The `marcam` Python package: built with maturin (`maturin build --release` here, or
# `pip install .`), abi3 so one wheel serves Python 3.9 and later. scripts/build_wheel.py
# builds the same wheel without maturin, for tests.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "marcam"
version = "0.1.0"
description = "4th-axis rotary CAM engine: plan, post, simulate and estimate CNC programs (JSON in, JSON out)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["cam", "cnc", "gcode", "4th-axis", "toolpath"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/malvira/marcam"
Repository = "https://github.com/malvira/marcam"

[tool.maturin]
module-name = "marcam"
features = ["pyo3/extension-module"]
